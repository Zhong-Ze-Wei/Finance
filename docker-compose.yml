version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: crypto-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-crypto2024}
      MYSQL_DATABASE: crypto_dashboard
      MYSQL_USER: ${MYSQL_USER:-crypto_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crypto_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/02-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-dashboard-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: crypto_dashboard
      DB_USER: ${MYSQL_USER:-crypto_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-crypto_pass}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - /app/server/node_modules

  # 前端服务（开发模式）
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crypto-dashboard-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local

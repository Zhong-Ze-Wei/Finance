services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: crypto-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-crypto2024}
      MYSQL_DATABASE: crypto_dashboard
      MYSQL_USER: ${MYSQL_USER:-crypto_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crypto_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/02-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端 API + 前端静态托管（生产模式，唯一对外入口 :3001）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-dashboard-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: crypto_dashboard
      DB_USER: ${MYSQL_USER:-crypto_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-crypto_pass}
    env_file:
      - ./server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - /app/server/node_modules

  # 前端开发服务器（热更新，仅开发时启动：docker compose --profile dev up）
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crypto-dashboard-frontend
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "3000:3000"
    environment:
      # 宿主机梯子代理（Clash）与后端服务地址（容器网络内按服务名访问）
      VPN_PROXY: ${VPN_PROXY:-http://host.docker.internal:7891}
      VITE_API_TARGET: http://backend:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
